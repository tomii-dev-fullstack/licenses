name: Deploy a EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Subir archivos a EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: "."                      
          target: "/home/ubuntu/licenses"     

      - name: Ejecutar comandos en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/licenses
            npm install || { echo 'npm install failed'; exit 1; }
            nohup npm start &
            
      - name: Verificar si el proceso está corriendo
        run: |
          ssh -i ${{ secrets.SSH_KEY }} ubuntu@${{ secrets.HOST }} "pgrep -fl 'npm start' || echo 'El servidor no está corriendo'"
